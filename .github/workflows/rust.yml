name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.actor != 'actions-user'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint with clippy
        run: cargo clippy -- -D warnings
      - name: Build (std)
        run: cargo build --verbose
      - name: Build (no_std)
        run: cargo build --no-default-features --verbose
      - name: Run tests (std)
        run: cargo test --verbose
      - name: Run tests (no_std)
        run: cargo test --no-default-features --verbose

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies for the MSRV
        run: cargo generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Build (std)
        run: cargo +1.75.0 build --verbose
      - name: Build (no_std)
        run: cargo +1.75.0 build --no-default-features --verbose

  semver:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check semver
        run: cargo semver-checks --workspace
